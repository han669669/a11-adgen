name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets an agent start a run by hand, for example right after Actions is turned on

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck, all tests (node:sqlite needs Node 22), vite build and a wrangler dry-run. No secrets: nothing deploys from here.
      - run: npm run check
