name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets an agent start a run by hand, for example right after Actions is turned on

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck, all tests (node:sqlite needs Node 22), vite build and a wrangler dry-run. No secrets: nothing deploys from here.
      - run: npm run check

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/requirements.txt
      # The input checks of the Python scripts, on synthetic pictures (no photo, no network).
      - run: python -m unittest discover -s scripts -p "test_*.py"
