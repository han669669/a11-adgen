name: check-avrea

# Trial: the same jobs as check.yml on Avrea runners. GitHub gives a public repository 4 vCPU on ubuntu-latest,
# so the check job uses the 4 vCPU, 8 GB Avrea size. It uses no setup-node npm cache: Avrea caches npm downloads itself.
# It runs beside check.yml so the two can be compared. It does not run for a pull request from a fork.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-avrea-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: avrea-ubuntu-latest-4-vcpu-8gb
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check

  scripts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p "test_*.py"
